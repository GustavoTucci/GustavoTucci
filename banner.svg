<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="260" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0A0B" />
      <stop offset="100%" stop-color="#121215" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#C9F31D" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#C9F31D" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272A" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <!-- Fundo + Grid + Glow -->
  <rect width="1200" height="260" rx="16" fill="url(#bg)" />
  <rect width="1200" height="260" rx="16" fill="url(#grid)" />
  <ellipse cx="600" cy="130" rx="460" ry="120" fill="url(#glow)" />
  <rect x="1" y="1" width="1198" height="258" rx="15" stroke="#27272A" stroke-width="1.5" />

  <!-- Tag superior -->
  <rect x="445" y="42" width="310" height="28" rx="14" fill="#18181B" stroke="#C9F31D" stroke-opacity="0.45" stroke-width="1" />
  <circle cx="465" cy="56" r="4" fill="#C9F31D" />
  <text x="608" y="60" text-anchor="middle" fill="#C9F31D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5">
    DATA &amp; GENAI ENGINEER
  </text>

  <!-- Nome principal -->
  <text x="600" y="138" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" letter-spacing="-1">
    Gustavo <tspan fill="#C9F31D">Tucci</tspan>
  </text>

  <!-- Subtítulo -->
  <text x="600" y="182" text-anchor="middle" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="0.5">
    Google ADK · Multi-Agent Systems · Python / FastAPI · GCP · Full-Stack
  </text>

  <!-- Barra inferior decorativa -->
  <rect x="520" y="212" width="160" height="3" rx="1.5" fill="#C9F31D" fill-opacity="0.85" />
</svg>
